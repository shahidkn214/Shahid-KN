<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0f2b23" />
      <stop offset="60%" stop-color="#051410" />
      <stop offset="100%" stop-color="#020608" />
    </radialGradient>

    <!-- Emerald-Cyan Accent Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Cyan-Emerald Reverse Gradient -->
    <linearGradient id="neonGradRev" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="ambientLight" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28" result="blur" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Ambient Glow Behind Symbol -->
  <circle cx="256" cy="256" r="140" fill="#10b981" opacity="0.25" filter="url(#ambientLight)" />

  <!-- Dynamic Geometric Soundwaves / Stream Rings -->
  <path d="M120 256 C120 180, 180 120, 256 120" fill="none" stroke="url(#neonGrad)" stroke-width="8" stroke-linecap="round" opacity="0.3" />
  <path d="M392 256 C392 332, 332 392, 256 392" fill="none" stroke="url(#neonGradRev)" stroke-width="8" stroke-linecap="round" opacity="0.3" />

  <!-- Nexversal 'N' & Download Arrow Symbol -->
  <g filter="url(#emeraldGlow)">
    <!-- Downward Arrow Stem / Core Column -->
    <path d="M256 130 L256 310" stroke="url(#neonGrad)" stroke-width="36" stroke-linecap="round" />

    <!-- Futuristic Chevron / Arrow Head -->
    <path d="M176 240 L256 320 L336 240" fill="none" stroke="url(#neonGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Modern Stream Base Plate / Tray -->
    <path d="M140 348 C140 372, 172 388, 256 388 C340 388, 372 372, 372 348" fill="none" stroke="url(#neonGradRev)" stroke-width="28" stroke-linecap="round" />

    <!-- Stylized Media Pulse Dots -->
    <circle cx="116" cy="256" r="14" fill="#34d399" />
    <circle cx="396" cy="256" r="14" fill="#22d3ee" />
  </g>
</svg>
